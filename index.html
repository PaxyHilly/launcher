<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launcher</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, Helvetica, sans-serif; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f3f4f6;
      }
      .panel {
        width: min(92vw, 720px);
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      }
      h1 { margin-top: 0; font-size: clamp(1.5rem, 3vw, 2.2rem); }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }
      input[type="file"] {
        flex: 1 1 280px;
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 10px;
        padding: 12px 14px;
        color: white;
      }
      select, button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
      }
      select {
        background: #0f172a;
        color: white;
        border: 1px solid #475569;
      }
      button {
        background: #2563eb;
        color: white;
        font-weight: 600;
      }
      button.secondary { background: #374151; }
      .status {
        margin-top: 16px;
        color: #cbd5e1;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Launcher</h1>

      <div class="row">
        <input id="fileInput" type="file" accept=".html,.htm,text/html" />
      </div>

      <div class="row">
        <label for="targetSelect" style="display:flex;align-items:center;gap:8px;">Target:</label>
        <select id="targetSelect">
          <option value="about:blank">about:blank</option>
          <option value="blob:">blob:</option>
        </select>
      </div>

      <div class="row">
        <button id="launchBtn">Launch</button>
        <button id="mcBtn" class="secondary">mc</button>
      </div>

      <div id="status" class="status">No file loaded.</div>
    </div>

    <script>
      const fileInput = document.getElementById('fileInput');
      const targetSelect = document.getElementById('targetSelect');
      const launchBtn = document.getElementById('launchBtn');
      const mcBtn = document.getElementById('mcBtn');
      const status = document.getElementById('status');

      let fileText = '';
      let fileName = '';
      let chosenTarget = 'about:blank';

      fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) {
          status.textContent = 'No file selected.';
          return;
        }

        fileName = file.name;
        try {
          fileText = await file.text();
          status.textContent = `Loaded: ${fileName}`;
        } catch (err) {
          status.textContent = 'Failed to read file.';
          console.error(err);
        }
      });

      targetSelect.addEventListener('change', () => {
        chosenTarget = targetSelect.value;
      });

      function openInTarget(html, target) {
        if (!html) {
          status.textContent = 'Upload an HTML file first.';
          return;
        }

        const newWin = window.open(target, '_blank');
        if (!newWin) {
          status.textContent = 'Popup blocked. Please allow popups and try again.';
          return;
        }

        const doc = newWin.document;
        doc.open();
        doc.write(html);
        doc.close();
      }

      launchBtn.addEventListener('click', () => {
        if (!fileText) {
          status.textContent = 'Please upload an HTML file first.';
          return;
        }

        openInTarget(fileText, chosenTarget);
        status.textContent = `Launched in ${chosenTarget}`;
      });

      mcBtn.addEventListener('click', () => {
        if (!fileText) {
          status.textContent = 'Please upload an HTML file first.';
          return;
        }

        const target = chosenTarget === 'about:blank' ? 'about:blank' : 'blob:';
        openInTarget(fileText, target);
        status.textContent = `mc launched in ${target}`;
      });
    </script>
  </body>
</html>
